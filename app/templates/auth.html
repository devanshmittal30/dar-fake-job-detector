{% extends 'base.html' %}

{% block title %}Account Access — Login or Sign Up | DAR{% endblock %}

{% block content %}
<section class="section" style="padding-top: 3rem; padding-bottom: 5rem;">
  <div class="container" style="max-width: 440px;">
    <!-- Centered App Icon (02_UI_UX_SPEC.md section 9.6) -->
    <div style="text-align: center; margin-bottom: 1.25rem;">
      <img
        src="{{ url_for('static', filename='img/dar-app-icon.svg') }}"
        alt="DAR App Icon"
        width="64"
        height="64"
        style="margin: 0 auto; display: block;"
      >
    </div>

    <h1 style="font-size: 1.75rem; text-align: center; margin-bottom: 0.35rem;">Welcome to DAR</h1>
    <p class="text-muted" style="text-align: center; margin-bottom: 1.75rem; font-size: 0.9375rem;">
      Sign in or create an account to verify job postings and join the fraud protection community.
    </p>

    <!-- Main Auth Card -->
    <div class="card" style="padding: 2rem;">
      <!-- Tab Bar: Login | Sign Up -->
      <div class="tab-bar" style="margin-bottom: 1.75rem;" role="tablist">
        <button
          type="button"
          class="tab-btn {% if request.args.get('tab') != 'register' %}active{% endif %}"
          id="auth-tab-login"
          role="tab"
          aria-selected="{% if request.args.get('tab') != 'register' %}true{% else %}false{% endif %}"
          aria-controls="auth-panel-login"
        >
          Log In
        </button>
        <button
          type="button"
          class="tab-btn {% if request.args.get('tab') == 'register' %}active{% endif %}"
          id="auth-tab-register"
          role="tab"
          aria-selected="{% if request.args.get('tab') == 'register' %}true{% else %}false{% endif %}"
          aria-controls="auth-panel-register"
        >
          Sign Up
        </button>
      </div>

      <!-- Inline Client Error Alert -->
      <div id="auth-error-alert" class="card" style="display: none; background-color: var(--fake-soft); border-color: rgba(220, 38, 38, 0.3); color: var(--fake); padding: 0.75rem 1rem; margin-bottom: 1.25rem; font-size: 0.875rem;">
        <span id="auth-error-text"></span>
      </div>

      <!-- 1. LOGIN PANEL -->
      <div id="auth-panel-login" role="tabpanel" style="display: {% if request.args.get('tab') != 'register' %}block{% else %}none{% endif %};">
        <form id="login-form" action="{{ url_for('auth.login') }}" method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <input type="hidden" name="next" value="{{ request.args.get('next', '/') }}">

          <div style="margin-bottom: 1.25rem;">
            <label for="login-email" class="form-label">Email address</label>
            <input
              type="email"
              id="login-email"
              name="email"
              class="input"
              placeholder="name@example.com"
              required
              autocomplete="email"
            >
          </div>

          <div style="margin-bottom: 1.5rem;">
            <label for="login-password" class="form-label" style="display: flex; justify-content: space-between;">
              <span>Password</span>
            </label>
            <div style="position: relative;">
              <input
                type="password"
                id="login-password"
                name="password"
                class="input"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
                style="padding-right: 2.75rem;"
              >
              <button
                type="button"
                class="btn-toggle-password"
                data-target="login-password"
                style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 0.25rem;"
                aria-label="Toggle password visibility"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
          </div>

          <button type="submit" id="login-submit-btn" class="btn btn-primary" style="width: 100%; justify-content: center; min-height: 44px;">
            Log In
          </button>
        </form>
      </div>

      <!-- 2. SIGN UP PANEL -->
      <div id="auth-panel-register" role="tabpanel" style="display: {% if request.args.get('tab') == 'register' %}block{% else %}none{% endif %};">
        <form id="register-form" action="{{ url_for('auth.register') }}" method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <input type="hidden" name="next" value="{{ request.args.get('next', '/') }}">

          <div style="margin-bottom: 1.25rem;">
            <label for="register-name" class="form-label">Full Name</label>
            <input
              type="text"
              id="register-name"
              name="name"
              class="input"
              placeholder="e.g. Rahul Sharma"
              required
              autocomplete="name"
            >
          </div>

          <div style="margin-bottom: 1.25rem;">
            <label for="register-email" class="form-label">Email address</label>
            <input
              type="email"
              id="register-email"
              name="email"
              class="input"
              placeholder="name@example.com"
              required
              autocomplete="email"
            >
          </div>

          <div style="margin-bottom: 1.25rem;">
            <label for="register-password" class="form-label">Password (minimum 8 characters)</label>
            <div style="position: relative;">
              <input
                type="password"
                id="register-password"
                name="password"
                class="input"
                placeholder="At least 8 characters"
                minlength="8"
                required
                autocomplete="new-password"
                style="padding-right: 2.75rem;"
              >
              <button
                type="button"
                class="btn-toggle-password"
                data-target="register-password"
                style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 0.25rem;"
                aria-label="Toggle password visibility"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
          </div>

          <div style="margin-bottom: 1.5rem;">
            <label for="register-confirm-password" class="form-label">Confirm Password</label>
            <div style="position: relative;">
              <input
                type="password"
                id="register-confirm-password"
                name="confirm_password"
                class="input"
                placeholder="Re-enter your password"
                minlength="8"
                required
                autocomplete="new-password"
                style="padding-right: 2.75rem;"
              >
              <button
                type="button"
                class="btn-toggle-password"
                data-target="register-confirm-password"
                style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 0.25rem;"
                aria-label="Toggle password visibility"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
          </div>

          <button type="submit" id="register-submit-btn" class="btn btn-primary" style="width: 100%; justify-content: center; min-height: 44px;">
            Create Account
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
  const tabLogin = document.getElementById('auth-tab-login');
  const tabRegister = document.getElementById('auth-tab-register');
  const panelLogin = document.getElementById('auth-panel-login');
  const panelRegister = document.getElementById('auth-panel-register');
  const errorAlert = document.getElementById('auth-error-alert');
  const errorText = document.getElementById('auth-error-text');

  function showTab(tab) {
    if (errorAlert) errorAlert.style.display = 'none';
    if (tab === 'register') {
      tabRegister.classList.add('active');
      tabRegister.setAttribute('aria-selected', 'true');
      tabLogin.classList.remove('active');
      tabLogin.setAttribute('aria-selected', 'false');
      panelRegister.style.display = 'block';
      panelLogin.style.display = 'none';
      const nameInput = document.getElementById('register-name');
      if (nameInput) nameInput.focus();
    } else {
      tabLogin.classList.add('active');
      tabLogin.setAttribute('aria-selected', 'true');
      tabRegister.classList.remove('active');
      tabRegister.setAttribute('aria-selected', 'false');
      panelLogin.style.display = 'block';
      panelRegister.style.display = 'none';
      const emailInput = document.getElementById('login-email');
      if (emailInput) emailInput.focus();
    }
  }

  if (tabLogin) tabLogin.addEventListener('click', () => showTab('login'));
  if (tabRegister) tabRegister.addEventListener('click', () => showTab('register'));

  // Password visibility toggle
  const toggleButtons = document.querySelectorAll('.btn-toggle-password');
  toggleButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      const targetId = btn.dataset.target;
      const input = document.getElementById(targetId);
      if (!input) return;

      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></line><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
      } else {
        input.type = 'password';
        btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
      }
    });
  });
});
</script>
{% endblock %}
