{% extends 'base.html' %}

{% block title %}Account Access | DAR{% endblock %}

{% block content %}
<section class="section">
  <div class="container" style="max-width: 440px; text-align: center;">
    <!-- Centered App Icon as specified in UI spec section 2 -->
    <div style="margin-bottom: 1.5rem;">
      <img src="{{ url_for('static', filename='img/dar-app-icon.svg') }}" alt="DAR" style="height: 64px; width: 64px;">
    </div>
    <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Welcome to DAR</h1>
    <p class="text-muted" style="margin-bottom: 2rem;">Log in or create an account to vote on ads and submit community reviews.</p>

    <div class="card" style="padding: 2rem; text-align: left;">
      <div class="tab-bar" style="margin-bottom: 1.5rem;">
        <button type="button" class="tab-btn active">Log In</button>
        <button type="button" class="tab-btn">Sign Up</button>
      </div>

      <p class="caption" style="text-align: center; padding: 1.5rem 0;">
        Account authentication and session management will be activated in P12.
      </p>
    </div>
  </div>
</section>
{% endblock %}
