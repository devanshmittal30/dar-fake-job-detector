{% extends 'base.html' %}

{% block title %}500 - Server Error | DAR{% endblock %}

{% block content %}
<section class="section" style="min-height: calc(100vh - 280px); display: flex; align-items: center;">
  <div class="container" style="max-width: 540px; text-align: center;">
    <div style="margin-bottom: 2rem;">
      <img src="{{ url_for('static', filename='img/dar-logo.svg') }}" alt="DAR" style="width: 160px; height: auto;">
    </div>
    <div class="badge badge-fake" style="margin-bottom: 1rem; font-size: 0.875rem;">Error 500</div>
    <h1 style="font-size: 2.25rem; margin-bottom: 1rem;">Internal Server Error</h1>
    <p class="text-muted" style="margin-bottom: 2rem; font-size: 1.0625rem; line-height: 1.6;">
      Something went wrong on our side. Please try again in a few moments.
    </p>
    <a href="{{ url_for('pages.home') }}" class="btn btn-primary btn-lg">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      Return to Home
    </a>
  </div>
</section>
{% endblock %}
